name: flutter_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  flutter_dotenv: ^5.1.0
  supabase_flutter: ^1.0.0

  # UI + Icons
  cupertino_icons: ^1.0.8

  # ⭐ Required for photo uploads
  image_picker: ^1.0.7

  # ⭐ Required for file uploads (PDF, drawings, etc.)
  file_picker: file_picker: ^8.0.0


  # ⭐ Required for Excel export
  excel: ^2.0.0

  # ⭐ Required for saving files locally
  path_provider: ^2.1.2
  file_saver: ^0.2.12

  # ⭐ Required for sharing Excel files
  share_plus: ^7.2.0

  # ⭐ For date formatting (date_required, removal_date)
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - .env
